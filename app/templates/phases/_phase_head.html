{# Header dense cho mỗi phase page #}
<div class="page-head">
    <div class="page-head-row">
        <div>
            <h1>
                <span class="badge primary mono" style="vertical-align: 1px;">P{{ run.phase_no if run else "?" }}</span>
                {{ run.name if run else "Phase" }}
            </h1>
            <div class="meta">{{ company.name }} · {{ run.summary if run else "" }}</div>
        </div>
        <div class="page-actions">
            {% if run %}<span class="status done">{{ run.status }}</span>{% endif %}
            <a class="btn btn-sm" href="/c/{{ company.slug }}">← Tổng quan</a>
        </div>
    </div>
</div>
