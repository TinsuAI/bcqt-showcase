[project]
name = "bcqt-showcase"
version = "0.1.0"
description = "Demo Báo Cáo Quyết Toán Hải Quan — showcase cho khách hàng tiềm năng của Trọng Tín"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "mypy>=1.13", "pytest>=8.3"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
