name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Lint
        run: ruff check app

      - name: Smoke import
        run: python -c "from app.main import app; print(app.title)"

  docker:
    name: Docker config + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        env:
          SECRET_KEY: ci-secret
        run: docker compose config -q
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bcqt-showcase:ci

  deploy:
    name: Deploy to tinsu
    needs: [test, docker]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, bcqt-showcase]
    concurrency:
      group: deploy-tinsu-bcqt-showcase
      cancel-in-progress: false
    steps:
      - name: Pull latest code
        working-directory: /home/tinsu/bcqt-showcase
        run: |
          git fetch origin main
          git reset --hard origin/main
          git log -1 --pretty=format:'deployed %h %s'

      - name: Compose up (build + recreate)
        working-directory: /home/tinsu/bcqt-showcase
        run: docker compose up -d --build

      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8093/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy in time"
          docker compose -f /home/tinsu/bcqt-showcase/docker-compose.yml logs --tail=80 app
          exit 1

      - name: Smoke key endpoints
        run: |
          for path in /c/fdi-a-bn /c/fdi-a-bn/bom /c/fdi-a-bn/risks; do
            curl -fsS -o /dev/null -w "%{http_code}  ${path}\n" "http://127.0.0.1:8093${path}"
          done
